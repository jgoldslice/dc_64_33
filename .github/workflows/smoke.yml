name: Canvas browser smoke tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Verify JavaScript syntax
        run: |
          for file in *.js tests/*.spec.cjs; do
            node --check "$file"
          done
      - name: Validate native Share Extension safe-staging script
        if: hashFiles('native-share-extension/scripts/prepare-ios.sh') != ''
        run: |
          bash -n native-share-extension/scripts/prepare-ios.sh
          bash -n native-share-extension/scripts/test-prepare-ios.sh
          bash native-share-extension/scripts/test-prepare-ios.sh
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run Canvas smoke tests
        run: npx playwright test --reporter=line
