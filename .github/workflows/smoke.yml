name: Canvas browser smoke tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Verify JavaScript syntax
        run: |
          for file in *.js tests/*.spec.cjs; do
            node --check "$file"
          done
      - name: Run standalone Node regression tests (native archive and Notes logic)
        run: node --test tests/*.test.cjs
      - name: Install Chromium and WebKit for attachment restore coverage
        run: npx playwright install --with-deps chromium webkit
      - name: Run Canvas smoke tests
        run: npx playwright test --reporter=line
