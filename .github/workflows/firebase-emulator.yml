name: Blueprint Firebase emulator
on:
  pull_request:
    paths:
      - .github/workflows/firebase-emulator.yml
      - firebase.json
      - blueprint-cloud-backup.mjs
      - firestore.rules
      - storage.rules
      - sync/**
      - tests/firebase-planner.emulator.mjs
permissions:
  contents: read
jobs:
  planner-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and SDK
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.10.0 firebase-tools@15
      - name: Exercise Auth, Firestore and Storage with a demo project
        run: npx --no-install firebase emulators:exec --project demo-blueprint-sync --only auth,firestore,storage "node --test tests/firebase-planner.emulator.mjs"
