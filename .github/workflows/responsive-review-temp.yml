name: Focused responsive review
on:
  push:
    branches: [feature/responsive-dialog-fit-v963]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install chromium
      - run: npx playwright test tests/responsive-forms-v963.spec.cjs tests/blueprint-ipad-qa-v891.spec.cjs tests/canvas-zoom-v815.spec.cjs --workers=2 --reporter=line
