name: Focused project appearance checks
on:
  push:
    branches: [codex/project-appearance-test-only]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install chromium
      - run: npx playwright test tests/project-appearance-v964.spec.cjs tests/responsive-layout-v922.spec.cjs tests/project-area-customization-v952.spec.cjs tests/apple-polish.spec.cjs --max-failures=1 --reporter=line
