name: Publish dc6433

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Public Firebase Web SDK identifiers only; authorization is enforced by Firebase Rules.
      # Keep the repository's default firebase-client.json null for local and test builds.
      - name: Configure Blueprint web client
        run: |
          cat > firebase-client.json <<'BLUEPRINT_FIREBASE_CONFIG'
          {"apiKey":"AIzaSyDL_NPdntLoDoHiyo2Li5qdSISoYmCWHrA","authDomain":"blueprint-bf366.firebaseapp.com","projectId":"blueprint-bf366","storageBucket":"blueprint-bf366.firebasestorage.app","messagingSenderId":"693172268920","appId":"1:693172268920:web:11ae5b9c24f8dcad39628d"}
          BLUEPRINT_FIREBASE_CONFIG
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      # Artifact metadata may lag after upload finalization. A unique name
      # also keeps a retried workflow from finding artifacts from old attempts.
      - name: Allow artifact metadata to become available
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
